<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador Vehicular Guatemala</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">🚗 Verificador GT</h1>
            <p class="text-sm text-gray-500 mt-1">Revisa el estado de la SAT, multas y reporte de robo al instante.</p>
        </div>
        
        <form id="vehicleForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">NIT del Propietario</label>
                <input type="text" id="nit" required placeholder="Ej. 1234567-8" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Número de VIN (Chasis)</label>
                <input type="text" id="vin" required placeholder="Ej. JA4MW31G560XXXXXX" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:bg-blue-700 transition shadow-md">
                Consultar Vehículo
            </button>
        </form>

        <div id="loading" class="hidden mt-6 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
            <p class="text-sm text-blue-600 font-medium mt-2">Consultando registros en vivo (aprox. 30s)...</p>
        </div>

        <div id="result" class="hidden mt-6 p-4 bg-gray-50 rounded-xl border border-gray-200 text-sm space-y-2">
            <!-- Results populated dynamically -->
        </div>
    </div>

    <script>
        document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nit = document.getElementById('nit').value.trim();
            const vin = document.getElementById('vin').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const btn = document.getElementById('submitBtn');

            loading.classList.remove('hidden');
            result.classList.add('hidden');
            btn.disabled = true;

            try {
                const response = await fetch('https://gt-vehicle-api.onrender.com/api/check-vehicle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nit, vin })
                });
                const json = await response.json();
                
                if (json.success && json.data) {
                    const data = json.data;
                    const sat = data.sat_status || {};
                    const theft = data.pnc_theft_record || {};
                    
                    result.innerHTML = `
                        <h3 class="font-bold text-gray-800 text-base mb-2 border-b pb-1">📋 Resultado del Reporte</h3>
                        <p><strong>Vehículo:</strong> ${sat.make || 'N/A'} ${sat.model || ''} (${sat.year || 'N/A'})</p>
                        <p><strong>Color:</strong> ${sat.color || 'N/A'}</p>
                        <p><strong>Estado SAT:</strong> <span class="px-2 py-0.5 rounded text-xs font-semibold ${sat.status === 'ACTIVO' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${sat.status || 'N/A'}</span></p>
                        <p><strong>Impuestos Pendientes:</strong> ${sat.taxes_owed || '0.00 GTQ'}</p>
                        <p><strong>Reporte de Robo (PNC):</strong> <span class="font-bold ${theft.stolen_report_active ? 'text-red-600' : 'text-green-600'}">${theft.stolen_report_active ? '🔴 ¡ALERTA: Reportado como Robado!' : '🟢 Sin reporte de robo'}</span></p>
                    `;
                } else {
                    result.innerHTML = `<p class="text-red-600 font-medium">Error: ${json.error || 'No se pudo completar la consulta.'}</p>`;
                }
            } catch (err) {
                result.innerHTML = `<p class="text-red-600 font-medium">Error de conexión con el servidor.</p>`;
            } finally {
                loading.classList.add('hidden');
                result.classList.remove('hidden');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
